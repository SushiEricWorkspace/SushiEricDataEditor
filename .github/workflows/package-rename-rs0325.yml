name: Package Rename rs0325

on:
  push:
    branches:
      - agent/package-rs0325

permissions:
  contents: write

jobs:
  rename-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rename package directories
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' dir; do
            new_dir="${dir%/toumokorosi01}/rs0325"
            mkdir -p "$(dirname "$new_dir")"
            git mv "$dir" "$new_dir"
          done < <(find . -type d -path '*/io/github/toumokorosi01' -print0)

      - name: Replace package references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          old_dot = b"io.github.toumokorosi01"
          new_dot = b"io.github.rs0325"
          old_path = b"io/github/toumokorosi01"
          new_path = b"io/github/rs0325"

          result = subprocess.run(
              ["git", "grep", "-Il", "toumokorosi01"],
              check=False,
              capture_output=True,
              text=True,
          )
          for raw_path in result.stdout.splitlines():
              path = Path(raw_path)
              data = path.read_bytes()
              updated = data.replace(old_dot, new_dot).replace(old_path, new_path)
              if updated != data:
                  path.write_bytes(updated)
          PY

      - name: Verify old package is gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n 'io\.github\.toumokorosi01'; then
            echo '旧パッケージ参照が残っています。'
            exit 1
          fi
          if git grep -n 'io/github/toumokorosi01'; then
            echo '旧パッケージパス参照が残っています。'
            exit 1
          fi
          if find . -type d -path '*/io/github/toumokorosi01' -print -quit | grep -q .; then
            echo '旧パッケージディレクトリが残っています。'
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit \
            -m 'refactor: パッケージ名をrs0325へ変更' \
            -m '- io.github.toumokorosi01をio.github.rs0325へ変更' \
            -m '- CommonとSushiEricDataEditor2のパッケージディレクトリを新しい名前空間へ移動' \
            -m '- 設定・完全修飾名・Gradle上の旧パッケージ参照を更新'
          git push origin HEAD:${GITHUB_REF_NAME}
